# Security headers, factored out so they can be re-included in every context
# that needs them.
#
# WHY THIS FILE EXISTS -- the nginx `add_header` inheritance trap:
#
#   add_header directives are inherited from an outer block ONLY IF the inner
#   block declares NO add_header of its own. The moment a `location` adds a
#   single header (say Cache-Control), it silently DISCARDS every add_header
#   inherited from `server`.
#
#   That is how a site ends up serving its HTML document -- the one thing a CSP
#   actually protects -- with no CSP at all, while `curl -I` on some other path
#   shows the header present and everything looks fine.
#
# So: every location block below that sets any header must `include` this file.
# It lives in /etc/nginx/snippets/ rather than /etc/nginx/conf.d/ because
# conf.d/*.conf is auto-included at http level by the stock nginx.conf.

# 'unsafe-inline' is present for style-src only, because the bundler may inline
# small stylesheets. script-src has NO unsafe-inline -- that is the directive
# that actually stops injected-script XSS.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# NOTE: Strict-Transport-Security is deliberately NOT set here. It belongs on
# the TLS-terminating proxy in front of this container. Emitting it over plain
# HTTP is meaningless, and a wrong max-age can lock a domain out of HTTP for
# months with no way to undo it client-side.
