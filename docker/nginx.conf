# nginx config for the web tier.
#
# This container is the ONLY thing published to the host in compose.prod. It
# does two jobs:
#   1. serves the compiled SPA with correct cache semantics;
#   2. reverse-proxies /api/ to the API on the internal network.
#
# Job 2 is what lets the API and Postgres stay completely unpublished: the
# browser talks to nginx on one origin, and nginx reaches the API over a
# network the host cannot route to. It also makes the API same-origin, so no
# CORS preflight is involved in production at all.
#
# Runs from nginxinc/nginx-unprivileged, so nginx listens on 8080 as a
# non-root user. Ports below 1024 need CAP_NET_BIND_SERVICE, which we drop.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Must be >= the API's BODY_LIMIT, or nginx rejects a request the API was
    # willing to accept and the client sees a confusing 413 from the wrong tier.
    client_max_body_size 1m;

    # Do not advertise the exact nginx version to every scanner on the internet.
    server_tokens off;

    # ---- security headers ---------------------------------------------------
    # These live on the WEB tier, not the API: this is the tier that serves an
    # actual HTML document, and a CSP header on a JSON response protects
    # nothing.
    #
    # Included rather than written inline, and re-included in every location
    # block that sets a header of its own. See the long explanation of nginx's
    # add_header inheritance trap in that file -- getting this wrong silently
    # drops the CSP from exactly the response that needs it.
    include /etc/nginx/snippets/security-headers.conf;

    # ---- compression --------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # ---- container healthcheck ---------------------------------------------
    # Separate from the SPA fallback so a healthcheck can never be answered by
    # index.html with a 200 -- which would report "healthy" for a broken build.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # ---- API reverse proxy --------------------------------------------------
    # The trailing slash on proxy_pass is load-bearing: it strips the /api/
    # prefix, so /api/items reaches the API as /items. Without it the API sees
    # /api/items and returns 404.
    location /api/ {
        proxy_pass http://api:4000/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The API sets `trust proxy = 1` and reads the LAST entry, so the value
        # a client tries to forge is discarded rather than trusted.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass correlation headers through so a browser-initiated trace is
        # continued by the API rather than restarted.
        proxy_set_header X-Request-Id      $http_x_request_id;
        proxy_set_header traceparent       $http_traceparent;

        # Keep-alive to the upstream: reconnecting per request is a measurable
        # cost at any real rate.
        proxy_set_header Connection "";

        # Bounded. An unbounded proxy read timeout turns one slow API call into
        # an exhausted nginx worker pool.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Never cache API responses at this tier.
        proxy_buffering off;
    }

    # ---- static assets ------------------------------------------------------
    # Vite emits content-hashed filenames (index-a1b2c3d4.js). A new build
    # produces a new name, so these can be cached forever and never revalidated.
    location /assets/ {
        # One directive, one header. Using `expires 1y` here as well would emit
        # a SECOND Cache-Control line; browsers merge them, but a duplicate
        # header is the kind of thing that makes a CDN behave unpredictably.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # Re-included: the add_header above would otherwise discard every
        # inherited security header on asset responses.
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # ---- SPA fallback -------------------------------------------------------
    # Any path that is not a real file returns index.html so client-side
    # routing works on a hard refresh or a pasted deep link.
    #
    # index.html itself must NOT be cached: it is the document that points at
    # the hashed asset names. A cached index.html keeps loading the PREVIOUS
    # build's assets after a deploy -- the classic "users see the old app until
    # they hard-refresh" bug.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        # Re-included. This is THE response a CSP protects -- the HTML
        # document. Omitting this include is the exact bug described in the
        # snippet's header comment.
        include /etc/nginx/snippets/security-headers.conf;
    }
}
