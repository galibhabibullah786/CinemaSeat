  #       uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
  #       with:
  #         host: ${{ secrets.DEPLOY_HOST }}
  #         username: ${{ secrets.DEPLOY_USER }}
  #         key: ${{ secrets.DEPLOY_SSH_KEY }}
  #         envs: IMAGE_TAG
  #         script: |
  #           set -euo pipefail
  #           cd /opt/baseplate
  #           bash scripts/deploy.sh --pull
